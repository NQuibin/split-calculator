<text x="350" y="40" font-family="IBM Plex Sans, sans-serif" font-size="22" font-weight="400" fill="#2f4a3c">☰</text>
<text x="20" y="121" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="600" fill="#1e2a22">Settings</text>
<text x="20" y="149" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#4b5a4f">Manage your profile and preferences.</text>

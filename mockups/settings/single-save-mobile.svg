<text x="88" y="593" font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="400" fill="#4b5a4f">Canadian Dollar</text>
<text x="342" y="593" font-family="IBM Plex Sans, sans-serif" font-size="18" font-weight="400" fill="#2f4a3c">⌄</text>

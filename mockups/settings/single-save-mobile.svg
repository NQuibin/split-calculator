<svg xmlns="http://www.w3.org/2000/svg" width="393" height="900" viewBox="0 0 393 900" role="img" aria-labelledby="title desc">
<title id="title">Settings redesign, single-save mobile</title>
<desc id="desc">Mobile settings page with icon-free headings and single-save behavior.</desc>
<rect x="0" y="0" width="393" height="900" rx="0" fill="#edf1e4"/>
<rect x="0" y="0" width="393" height="64" rx="0" fill="#f7f5ec"/>
